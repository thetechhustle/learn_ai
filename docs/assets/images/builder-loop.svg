<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="The Builder Loop: Vision, Context, Build, Verify, Ship">
  <rect width="640" height="400" rx="14" fill="#111827"/>
  <text x="320" y="52" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="800" fill="#f9fafb" text-anchor="middle">THE BUILDER LOOP</text>
  <text x="320" y="78" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#9ca3af" text-anchor="middle">the habit behind everything you will build with AI</text>

  <!-- loop path -->
  <ellipse cx="320" cy="230" rx="230" ry="115" fill="none" stroke="#4c1d95" stroke-width="2" stroke-dasharray="6 7"/>

  <!-- Vision -->
  <g>
    <rect x="255" y="98" width="130" height="46" rx="23" fill="#7c3aed"/>
    <text x="320" y="127" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">VISION</text>
  </g>
  <!-- Context -->
  <g>
    <rect x="472" y="172" width="130" height="46" rx="23" fill="#1f2937" stroke="#7c3aed" stroke-width="2"/>
    <text x="537" y="201" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700" fill="#e5e7eb" text-anchor="middle">CONTEXT</text>
  </g>
  <!-- Build -->
  <g>
    <rect x="410" y="300" width="130" height="46" rx="23" fill="#1f2937" stroke="#7c3aed" stroke-width="2"/>
    <text x="475" y="329" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700" fill="#e5e7eb" text-anchor="middle">BUILD</text>
  </g>
  <!-- Verify -->
  <g>
    <rect x="100" y="300" width="130" height="46" rx="23" fill="#1f2937" stroke="#f59e0b" stroke-width="2"/>
    <text x="165" y="329" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700" fill="#e5e7eb" text-anchor="middle">VERIFY</text>
  </g>
  <!-- Ship -->
  <g>
    <rect x="38" y="172" width="130" height="46" rx="23" fill="#f59e0b"/>
    <text x="103" y="201" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="700" fill="#111827" text-anchor="middle">SHIP</text>
  </g>

  <!-- arrows -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a78bfa"/>
    </marker>
  </defs>
  <path d="M 392 130 Q 500 140 528 166" fill="none" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 540 224 Q 545 275 505 296" fill="none" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 404 323 L 236 323" fill="none" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 128 296 Q 92 275 98 224" fill="none" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 112 166 Q 140 140 248 130" fill="none" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#arrow)"/>
</svg>
